# Parameters for the UMIUSI deploy autonomy nodes. Loaded by launch/autonomy.launch.py.
# Override at launch: `ros2 launch umiusi_autonomy autonomy.launch.py model_path:=/abs/model.pt`

perception_node:
  ros__parameters:
    # REQUIRED: learned detector checkpoint (.pt). Override at launch (see model_path launch arg).
    model_path: ""
    image_topic: "/front_cam/image_raw"
    detections_topic: "/perception_node/detections"
    conf_thresh: -1.0        # <0 -> use the checkpoint's stored confidence floor
    input_size: 0            # 0  -> use the checkpoint's stored input size
    fovy_deg: 60.0           # MUST match the physical camera vertical FOV
    max_rate_hz: 10.0        # cap detector rate (realistic Pi-4 timing); 0 = every frame
    sanitise_near: true      # near red/blue colour re-confirmation before the FSM commits

navigator_node:
  ros__parameters:
    detections_topic: "/perception_node/detections"
    imu_topic: "/state/imu"
    control_hz: 50.0
    frame_h: 240
    frame_w: 320
    fovy_deg: 60.0
    servo_range_deg: 90.0    # ThrusterOutput.angle [rad] = servo_action * radians(servo_range_deg)
    # DEPLOY CALIBRATION — verify against the mounted IMU (sensor_msgs/Imu.angular_velocity is RAD/S):
    yaw_rate_axis: "y"       # IMU axis carrying the vehicle yaw rate (x/y/z); sim uses y (up)
    yaw_rate_sign: 1.0
    # IMU サニティフィルタ (実機 BNO055 の化けサンプル対策)。
    # ゼロクォータニオン / 角速度の int16 フルスケール張り付き / 姿勢の跳躍 を検出する。
    # **既定は検出とログだけで、値は破棄しない** — 実機で該当は 0.44% しかなく、一方で
    # フィルタ自身の誤爆のほうが被害が大きかったため (docs/known_issues.md A-1)。
    # データが貯まって閾値を決めたら true にする。
    imu_sanity_enforce: false
    imu_max_gyro: 10.0        # [rad/s] 検出の閾値 (フルスケールは 35.74)
    imu_max_step_deg: 30.0    # 1 サンプルの姿勢跳躍上限 [deg]。50Hz なら 1500 deg/s 相当
    publish: true            # false -> compute the FSM but do NOT command the thrusters (dry test)
    command_mode: "direct"   # "direct" -> /cmd/direct ThrusterOutput (default, self-enabling).
                             # "target" -> ride on core: publish Target on /cmd/target (EXPERIMENTAL;
                             #             needs power-on + AUTO mode; see navigator_node docstring).
    target_topic: "/cmd/target"   # only used when command_mode == "target"

auto_target_generator:          # lifecycle node for the on-core path (core_autonomy.launch.py)
  ros__parameters:
    detections_topic: "/perception_node/detections"
    imu_topic: "/state/imu"
    target_topic: "/cmd/target"
    control_hz: 50.0
    frame_h: 240
    frame_w: 320
    fovy_deg: 60.0
    # DEPLOY CALIBRATION — verify against the mounted IMU (sensor_msgs/Imu.angular_velocity is RAD/S):
    yaw_rate_axis: "y"       # IMU axis carrying the vehicle yaw rate (x/y/z); sim uses y (up)
    yaw_rate_sign: 1.0
    # IMU サニティフィルタ (実機 BNO055 の化けサンプル対策)。
    # ゼロクォータニオン / 角速度の int16 フルスケール張り付き / 姿勢の跳躍 を検出する。
    # **既定は検出とログだけで、値は破棄しない** — 実機で該当は 0.44% しかなく、一方で
    # フィルタ自身の誤爆のほうが被害が大きかったため (docs/known_issues.md A-1)。
    # データが貯まって閾値を決めたら true にする。
    imu_sanity_enforce: false
    imu_max_gyro: 10.0        # [rad/s] 検出の閾値 (フルスケールは 35.74)
    imu_max_step_deg: 30.0    # 1 サンプルの姿勢跳躍上限 [deg]。50Hz なら 1500 deg/s 相当
