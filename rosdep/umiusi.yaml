# UMIUSI 固有の rosdep ルール (**任意**)。
#
# 通常は `tools/setup_robot.sh` を使えばよく、これは不要。
# 素の `rosdep install` だけで torch まで入れたい場合にのみ登録する:
#
#   sudo tee /etc/ros/rosdep/sources.list.d/50-umiusi.list <<< \
#     "yaml https://raw.githubusercontent.com/rogy-AquaLab/sinsei_UMIUSI_autonomy/main/rosdep/umiusi.yaml"
#   rosdep update
#
# ただしこの経路には**システム側を書き換える必要がある**という難点がある:
#   * rosdep の pip インストーラは sudo で system-wide に入れるため、PEP 668 を外す設定
#     (`/etc/pip.conf` の `break-system-packages`) をシステムに置く必要がある
#   * torch の CPU 版を取らせる `--index-url` も rosdep のルールには書けないので、
#     同じく `/etc/pip.conf` に `index-url` を書くことになる
#
# `setup_robot.sh` は Python の依存を `--user` (~/.local) に入れるので、
# **システムのファイルを一切書き換えずに済む**。そちらを既定とする。
#
# なお package.xml からは python3-torch-cpu を**参照していない**。参照すると、この
# ルールを登録していない機体で `rosdep install` 自体が失敗してしまうため。

python3-torch-cpu:
  ubuntu:
    pip:
      packages: [torch]

# ----------------------------------------------------------------------------
# umiusi_perception — 検出器と風船割り FSM の実体
#
# **まだ package.xml から参照していない。** 供給元の Umiusi_sim が private なため、
# このルールを有効にすると認証の無い機体で `rosdep install` が失敗するため。
# Umiusi_sim を public にすれば、そのまま使えるようになる。
# それまでは docs/robot_setup.md のとおり PC から転送して pip install する。
umiusi_perception:
  ubuntu:
    pip:
      packages:
        - "umiusi_perception @ git+https://github.com/rogy-AquaLab/Umiusi_sim.git#subdirectory=packages/perception"
